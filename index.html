<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMXL — Home</title>
<style>
  :root {
    --bg: #050506;
    --panel: #0f0b0a;
    --panel-2: #171010;
    --ink: #f5f0ea;
    --muted: #8a7d78;
    --accent: #ff6a00;
    --accent-2: #ff2400;
    --accent-3: #ffcc00;
    --line: #e9edf5;
    --shadow: 0 10px 0 #000, 0 14px 24px rgba(0,0,0,.6);
  }

  /* ====== TEMA DARK (default) ====== */
  html[data-theme="dark"] {
    --bg: #050506;
    --ink: #f5f0ea;
    --muted: #8a7d78;
  }

  /* ====== TEMA KOMIK ====== */
  html[data-theme="comic"] {
    --bg: #f2f2f2;
    --panel: #ffffff;
    --panel-2: #f7f7f7;
    --ink: #0b0b0b;
    --muted: #4a4a4a;
    --line: #0b0b0b;
    --shadow: 0 8px 0 #000, 0 12px 20px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,106,0,.14), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,36,0,.18), transparent 45%),
      var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    padding: 24px 18px 18px;
    position: relative;
    overflow-x: hidden;
    transition: background .5s ease, color .4s ease;
  }

  /* Halftone dots */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 14px 14px;
    pointer-events: none;
    z-index: 0;
  }

  html[data-theme="comic"] body::before {
    background-image: radial-gradient(rgba(0,0,0,.12) 1px, transparent 1px);
    background-size: 10px 10px;
  }

  /* Vignette seram */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,.85) 100%);
    mix-blend-mode: multiply;
    animation: breathe 6s ease-in-out infinite;
  }

  html[data-theme="comic"] .vignette { opacity: 0; }

  /* Ember / percikan api */
  .embers { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .ember {
    position: absolute;
    width: 4px; height: 4px;
    background: radial-gradient(circle, #ffcc00, #ff2400 60%, transparent 70%);
    border-radius: 50%;
    opacity: 0;
    animation: rise linear infinite;
  }
  html[data-theme="comic"] .embers { display: none; }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    justify-content: center;
    gap: 26px;
  }

  /* ========== LOGO SMXL 3D FIERY ========== */
  .logo-stage {
    position: relative;
    display: inline-block;
    padding: 12px 6px;
  }

  .logo-glow {
    position: absolute;
    inset: -40px;
    background: radial-gradient(circle, rgba(255,106,0,.55), rgba(255,36,0,.25) 40%, transparent 70%);
    filter: blur(18px);
    animation: pulseGlow 2.6s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  html[data-theme="comic"] .logo-glow {
    background: radial-gradient(circle, rgba(255,106,0,.35), transparent 70%);
  }

  .logo {
    position: relative;
    z-index: 1;
    font-family: "Impact", "Haettenschweiler", "Arial Black", sans-serif;
    font-size: clamp(64px, 22vw, 108px);
    letter-spacing: -3px;
    margin: 0;
    line-height: 1;
    font-style: italic;
    transform: skewX(-8deg);
    background: linear-gradient(180deg, #ffcf8a 0%, #ff8a1f 35%, #ff4500 65%, #7a1200 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow:
      0 0 2px #000,
      2px 2px 0 #3a0a00,
      4px 4px 0 #230600,
      6px 6px 0 #120300,
      8px 8px 0 #000;
    filter: drop-shadow(0 0 14px rgba(255,90,0,.75)) drop-shadow(0 0 30px rgba(255,36,0,.4));
    animation: flicker 4.5s infinite;
  }

  .logo::after {
    content: "SMXL";
    position: absolute;
    inset: 0;
    font-family: inherit;
    font-size: inherit;
    font-style: inherit;
    letter-spacing: inherit;
    background: inherit;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transform: translate(2px, -2px);
    mix-blend-mode: screen;
    opacity: .55;
    animation: glitch 3.2s infinite;
    pointer-events: none;
  }

  .tagline {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin: 0;
    text-shadow: 0 0 8px rgba(255,90,0,.4);
  }

  /* ========== THEME SWITCH ========== */
  .theme-switch {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    background: var(--panel-2);
    border: 2.5px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 4px 0 #000, 0 0 18px rgba(255,90,0,.25);
  }

  .theme-switch button {
    font-family: "Impact", "Arial Black", sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 8px 16px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: transform .15s, background .25s, color .25s, box-shadow .25s;
  }

  .theme-switch button.active {
    background: linear-gradient(180deg, var(--accent-3), var(--accent));
    color: #0b0b0b;
    box-shadow: 0 0 14px rgba(255,106,0,.8), 0 0 26px rgba(255,36,0,.5);
    transform: scale(1.05);
  }

  .theme-switch button:active { transform: scale(.94); }

  /* ========== BUTTONS ========== */
  .actions {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px 20px;
    font-family: "Impact", "Arial Black", sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    text-decoration: none;
    color: #0b0b0b;
    background: linear-gradient(180deg, #ffcc00, #ff6a00);
    border: 3px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 6px 0 #000, 0 10px 22px rgba(255,60,0,.35), 0 0 22px rgba(255,106,0,.45);
    cursor: pointer;
    user-select: none;
    transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
    overflow: hidden;
  }

  html[data-theme="comic"] .btn {
    background: #fff;
    color: #000;
    box-shadow: 0 6px 0 #000;
  }

  .btn.store {
    background: linear-gradient(180deg, #ff2400, #7a1200);
    color: #fff;
  }

  html[data-theme="comic"] .btn.store {
    background: #000;
    color: #fff;
  }

  .btn::before {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.7), transparent);
    transform: skewX(-20deg);
    transition: left .5s ease;
  }

  .btn:hover::before { left: 130%; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active {
    transform: translateY(4px) scale(.98);
    box-shadow: 0 2px 0 #000, 0 4px 8px rgba(0,0,0,.5);
  }

  .btn .icon { font-size: 20px; }

  /* ========== FOOTER ========== */
  footer {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px dashed rgba(255,255,255,.12);
  }

  footer b { color: var(--accent); text-shadow: 0 0 8px rgba(255,106,0,.8); }

  html[data-theme="comic"] footer {
    border-top-color: rgba(0,0,0,.3);
  }
  html[data-theme="comic"] footer b { color: #ff2400; text-shadow: none; }

  /* ========== KEYFRAMES ========== */
  @keyframes pulseGlow {
    0%, 100% { opacity: .9; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  @keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: .78; }
  }

  @keyframes glitch {
    0%, 92%, 100% { transform: translate(2px, -2px); opacity: .55; }
    93% { transform: translate(-3px, 2px); opacity: .9; }
    94% { transform: translate(3px, -3px); opacity: .7; }
    95% { transform: translate(-2px, 3px); opacity: .85; }
    96% { transform: translate(2px, -2px); opacity: .55; }
  }

  @keyframes breathe {
    0%, 100% { opacity: .85; }
    50% { opacity: 1; }
  }

  @keyframes rise {
    0% { transform: translateY(0) scale(1); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-110vh) scale(.4); opacity: 0; }
  }

  @media (max-width: 360px) {
    .logo { font-size: 60px; }
    .btn { font-size: 18px; padding: 15px; }
    .theme-switch button { font-size: 11px; padding: 7px 12px; }
  }
</style>
</head>
<body>

  <div class="vignette"></div>
  <div class="embers" id="embers"></div>

  <main class="wrap">

    <!-- LOGO 3D FIERY -->
    <div class="logo-stage">
      <span class="logo-glow"></span>
      <h1 class="logo">SMXL</h1>
    </div>

    <p class="tagline">Comic • Dark • Horror</p>

    <!-- THEME SWITCH -->
    <div class="theme-switch" role="group" aria-label="Pilih Tema">
      <button id="btnComic" type="button">KOMIK</button>
      <button id="btnDark" class="active" type="button">DARK</button>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <a href="login.html" class="btn" id="btnLogin">
        <span class="icon">🔐</span> LOGIN
      </a>
      <button class="btn store" id="btnStore" type="button">
        <span class="icon">🛒</span> STORE
      </button>
    </div>
  </main>

  <footer>
    <b>@created by samil</b>
  </footer>

<script>
  /* ====== TEMA TOGGLE ====== */
  const html = document.documentElement;
  const btnComic = document.getElementById('btnComic');
  const btnDark  = document.getElementById('btnDark');

  function setTheme(theme) {
    html.setAttribute('data-theme', theme);
    btnComic.classList.toggle('active', theme === 'comic');
    btnDark.classList.toggle('active', theme === 'dark');
    try { localStorage.setItem('smxl-theme', theme); } catch(e) {}
  }

  // Muat preferensi tema
  let saved = 'dark';
  try { saved = localStorage.getItem('smxl-theme') || 'dark'; } catch(e) {}
  setTheme(saved);

  btnComic.addEventListener('click', () => setTheme('comic'));
  btnDark.addEventListener('click', () => setTheme('dark'));

  /* ====== EMBER PARTICLES ====== */
  const emberBox = document.getElementById('embers');
  const EMBER_COUNT = 22;
  for (let i = 0; i < EMBER_COUNT; i++) {
    const e = document.createElement('span');
    e.className = 'ember';
    e.style.left = Math.random() * 100 + 'vw';
    e.style.bottom = '-10px';
    const size = 2 + Math.random() * 4;
    e.style.width = size + 'px';
    e.style.height = size + 'px';
    e.style.animationDuration = (6 + Math.random() * 8) + 's';
    e.style.animationDelay = (Math.random() * 8) + 's';
    emberBox.appendChild(e);
  }

  /* ====== KLIK ====== */
  const btnStore = document.getElementById('btnStore');
  btnStore.addEventListener('click', () => {
    btnStore.style.transform = 'scale(.95)';
    setTimeout(() => { btnStore.style.transform = ''; }, 120);
    alert('STORE segera hadir! (demo)');
  });

  const btnLogin = document.getElementById('btnLogin');
  btnLogin.addEventListener('touchstart', () => {
    btnLogin.style.transform = 'translateY(2px)';
  }, { passive: true });
  btnLogin.addEventListener('touchend', () => {
    btnLogin.style.transform = '';
  });
</script>
</body>
  </html>
