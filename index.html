<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMXL — Home</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --ink: #f5f7ff;
    --muted: #8b93a7;
    --accent: #ffcc00;
    --accent-2: #ff3b6b;
    --line: #e9edf5;
    --shadow: 0 10px 0 #000, 0 14px 24px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,204,0,.12), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,59,107,.14), transparent 45%),
      var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    padding: 24px 18px 18px;
    position: relative;
    overflow-x: hidden;
  }

  /* Halftone comic dots */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 14px 14px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    justify-content: center;
    gap: 30px;
  }

  /* LOGO */
  .logo-box {
    position: relative;
    padding: 18px 28px;
    background: var(--panel);
    border: 3px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    transform: rotate(-2deg);
    animation: pop .6s cubic-bezier(.2,.9,.3,1.4) both;
  }

  .logo-box::after {
    content: "";
    position: absolute;
    inset: -10px;
    border: 2px dashed rgba(255,204,0,.5);
    border-radius: 20px;
    pointer-events: none;
    animation: dash 12s linear infinite;
  }

  .logo {
    font-family: "Impact", "Haettenschweiler", "Arial Black", sans-serif;
    font-size: clamp(48px, 16vw, 72px);
    letter-spacing: 3px;
    margin: 0;
    line-height: 1;
    color: var(--accent);
    text-shadow:
      3px 3px 0 #000,
      6px 6px 0 var(--accent-2);
    -webkit-text-stroke: 2px #000;
  }

  .tagline {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin: 0;
  }

  /* BUTTONS */
  .actions {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px 20px;
    font-family: "Impact", "Arial Black", sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    text-decoration: none;
    color: #0b0d12;
    background: var(--accent);
    border: 3px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 6px 0 #000, 0 10px 18px rgba(0,0,0,.45);
    cursor: pointer;
    user-select: none;
    transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
    overflow: hidden;
  }

  .btn.store {
    background: var(--accent-2);
    color: #fff;
  }

  .btn::before {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-20deg);
    transition: left .5s ease;
  }

  .btn:hover::before { left: 130%; }

  .btn:hover { transform: translateY(-2px); }
  .btn:active {
    transform: translateY(4px) scale(.98);
    box-shadow: 0 2px 0 #000, 0 4px 8px rgba(0,0,0,.5);
  }

  .btn .icon {
    font-size: 20px;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.5));
  }

  /* FOOTER */
  footer {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px dashed rgba(255,255,255,.12);
  }

  footer b { color: var(--accent); }

  @keyframes pop {
    0% { opacity: 0; transform: rotate(-8deg) scale(.7); }
    100% { opacity: 1; transform: rotate(-2deg) scale(1); }
  }

  @keyframes dash {
    to { background-position: 200px 0; }
  }

  @media (max-width: 360px) {
    .logo { font-size: 44px; }
    .btn { font-size: 18px; padding: 16px; }
  }
</style>
</head>
<body>

  <main class="wrap">
    <div class="logo-box">
      <h1 class="logo">SMXL</h1>
    </div>
    <p class="tagline">Comic • Dark Edition</p>

    <div class="actions">
      <a href="login.html" class="btn" id="btnLogin">
        <span class="icon">🔐</span> LOGIN
      </a>
      <button class="btn store" id="btnStore" type="button">
        <span class="icon">🛒</span> STORE
      </button>
    </div>
  </main>

  <footer>
    <b>@created by samil</b>
  </footer>

<script>
  // Efek klik halus untuk tombol STORE
  const btnStore = document.getElementById('btnStore');
  btnStore.addEventListener('click', () => {
    btnStore.style.transform = 'scale(.95)';
    setTimeout(() => { btnStore.style.transform = ''; }, 120);
    alert('STORE segera hadir! (demo)');
  });

  // Efek getar ringan ketika tombol login disentuh
  const btnLogin = document.getElementById('btnLogin');
  btnLogin.addEventListener('touchstart', () => {
    btnLogin.style.transform = 'translateY(2px)';
  }, { passive: true });
  btnLogin.addEventListener('touchend', () => {
    btnLogin.style.transform = '';
  });
</script>
</body>
</html>
