<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMXL — Login</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141824;
    --panel-2: #1c2130;
    --ink: #f5f7ff;
    --muted: #8b93a7;
    --accent: #ffcc00;
    --accent-2: #ff3b6b;
    --line: #e9edf5;
    --ok: #34d399;
    --shadow: 0 10px 0 #000, 0 18px 30px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,204,0,.14), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(255,59,107,.16), transparent 45%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 26px 18px 18px;
    position: relative;
    overflow-x: hidden;
  }

  /* Halftone dots */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 14px 14px;
    pointer-events: none;
    z-index: 0;
  }

  /* Garis gerak komik di pojok */
  .speed-lines {
    position: fixed;
    top: -40px; right: -40px;
    width: 220px; height: 220px;
    background: repeating-linear-gradient(
      135deg,
      rgba(255,204,0,.18) 0 4px,
      transparent 4px 14px
    );
    transform: rotate(15deg);
    pointer-events: none;
    opacity: .8;
    mask-image: radial-gradient(circle, #000 30%, transparent 70%);
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    justify-content: center;
    gap: 22px;
  }

  .brand {
    font-family: "Impact", "Arial Black", sans-serif;
    font-size: 34px;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 2px 2px 0 #000, 4px 4px 0 var(--accent-2);
    -webkit-text-stroke: 1.5px #000;
    margin: 0;
    text-align: center;
  }

  /* PANEL KOMIK */
  .panel {
    position: relative;
    width: 100%;
    background: var(--panel);
    border: 3px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 26px 20px 24px;
    animation: slideUp .5s cubic-bezier(.2,.9,.3,1.2) both;
  }

  /* Label comic di atas panel */
  .panel-label {
    position: absolute;
    top: -16px;
    left: 18px;
    background: var(--accent);
    color: #0b0d12;
    font-family: "Impact", "Arial Black", sans-serif;
    letter-spacing: 2px;
    font-size: 14px;
    padding: 6px 12px;
    border: 3px solid #000;
    border-radius: 8px;
    box-shadow: 0 4px 0 #000;
  }

  .title {
    font-family: "Impact", "Arial Black", sans-serif;
    font-size: 40px;
    letter-spacing: 4px;
    margin: 8px 0 22px;
    color: var(--ink);
    text-align: center;
    text-shadow: 3px 3px 0 #000, 5px 5px 0 var(--accent-2);
    -webkit-text-stroke: 1.5px #000;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: bold;
  }

  .field input {
    width: 100%;
    padding: 14px 15px;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    background: var(--panel-2);
    border: 2.5px solid var(--line);
    border-radius: 10px;
    outline: none;
    box-shadow: 0 4px 0 #000;
    transition: border-color .2s, box-shadow .2s, transform .12s;
  }

  .field input::placeholder { color: #5c6579; }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 4px 0 #000, 0 0 0 4px rgba(255,204,0,.18);
    transform: translateY(-1px);
  }

  .btn-login {
    width: 100%;
    margin-top: 10px;
    padding: 17px 20px;
    font-family: "Impact", "Arial Black", sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    color: #0b0d12;
    background: var(--accent);
    border: 3px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 6px 0 #000, 0 10px 18px rgba(0,0,0,.45);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform .12s, box-shadow .12s, background .2s;
  }

  .btn-login::before {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.6), transparent);
    transform: skewX(-20deg);
    transition: left .5s ease;
  }

  .btn-login:hover::before { left: 130%; }
  .btn-login:hover { transform: translateY(-2px); background: #ffd633; }
  .btn-login:active {
    transform: translateY(4px) scale(.98);
    box-shadow: 0 2px 0 #000, 0 4px 8px rgba(0,0,0,.5);
  }

  /* Pesan notifikasi */
  .message {
    margin-top: 14px;
    min-height: 24px;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity .35s ease, transform .35s ease;
  }

  .message.show {
    opacity: 1;
    transform: translateY(0);
  }

  .message.ok { color: var(--ok); }
  .message.err { color: var(--accent-2); }

  /* TEMA tag */
  .theme-tag {
    display: inline-block;
    margin: 0 auto;
    padding: 7px 16px;
    font-size: 12px;
    letter-spacing: 3px;
    font-weight: bold;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--panel-2);
    border: 2.5px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 3px 0 #000;
  }

  footer {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
    margin-top: 26px;
    padding-top: 14px;
    border-top: 1px dashed rgba(255,255,255,.12);
  }

  footer b { color: var(--accent); }

  @keyframes slideUp {
    0% { opacity: 0; transform: translateY(28px) rotate(-1deg); }
    100% { opacity: 1; transform: translateY(0) rotate(0); }
  }

  @media (max-width: 360px) {
    .title { font-size: 32px; }
    .btn-login { font-size: 18px; padding: 15px; }
    .panel { padding: 22px 15px 20px; }
  }
</style>
</head>
<body>

  <div class="speed-lines"></div>

  <main class="wrap">
    <h1 class="brand">SMXL</h1>

    <section class="panel">
      <span class="panel-label">LOGIN PANEL</span>
      <h2 class="title">LOGIN</h2>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">Username :</label>
          <input type="text" id="username" placeholder="Masukkan username" />
        </div>

        <div class="field">
          <label for="password">Password :</label>
          <input type="password" id="password" placeholder="Masukkan password" />
        </div>

        <button type="submit" class="btn-login">LOGIN</button>

        <div class="message" id="message"></div>
      </form>
    </section>

    <span class="theme-tag">TEMA : KOMIK | DARK</span>
  </main>

  <footer>
    <b>@created by samil</b>
  </footer>

<script>
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('message');

  function showMessage(text, type) {
    msg.textContent = text;
    msg.className = 'message show ' + type;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();

    if (!user || !pass) {
      showMessage('Username & Password wajib diisi!', 'err');
      return;
    }

    // Simulasi front-end saja (tanpa backend / tanpa sistem keamanan nyata)
    showMessage('Login berhasil (demo)', 'ok');

    setTimeout(() => {
      document.getElementById('password').value = '';
    }, 600);
  });
</script>
</body>
  </html>
